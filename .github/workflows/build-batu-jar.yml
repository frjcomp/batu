name: Build batu jar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub release tag to attach the jar to (for example v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build jar
        run: ./gradlew clean jar --no-daemon --console=plain

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: batu.jar
          path: build/libs/batu.jar

      - name: Attach jar to existing GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" build/libs/batu.jar --clobber

      - name: Create GitHub release and attach jar for tag builds
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/batu.jar
          generate_release_notes: true
